services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: octattoo
      POSTGRES_PASSWORD: "ep7vFBoddwyK4WqDLX1pNHlQj5uW9itW"
    volumes:
      - octattoo_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "hfjVCFc9VTcZCPc6RaOOh33BMDapFNAA"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: octattoo_test
      POSTGRES_PASSWORD: "rbwal3oyTihfRvs0SIHcfQoLU3hfwpe3"
    volumes:
      - octattoo_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "qCiaJXdiFzGiA07fwjvI7-pAe_Xj9SgD"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  octattoo_data:
  octattoo_test_data:
